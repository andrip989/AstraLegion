<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3b1d7a"/>
      <stop offset="0.55" stop-color="#1a0f3d"/>
      <stop offset="1" stop-color="#07051a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ff4d6d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#a8650f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5fd9"/>
      <stop offset="1" stop-color="#0f1f66"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f2ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fa6c9"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ff5e3a"/>
      <stop offset="1" stop-color="#b3122f"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- light rays -->
    <g opacity="0.18" fill="#8fb8ff">
      <polygon points="256,230 236,0 276,0"/>
      <polygon points="256,230 0,90 0,140"/>
      <polygon points="256,230 512,90 512,140"/>
      <polygon points="256,230 60,512 120,512"/>
      <polygon points="256,230 452,512 392,512"/>
    </g>
    <circle cx="256" cy="236" r="200" fill="url(#glow)"/>

    <!-- crossed swords (behind shield) -->
    <g id="sword" transform="rotate(-40 256 256)">
      <polygon points="256,40 272,70 272,330 240,330 240,70" fill="url(#blade)" stroke="#5b6f91" stroke-width="3"/>
      <line x1="256" y1="60" x2="256" y2="320" stroke="#b9c8e0" stroke-width="3"/>
      <rect x="200" y="328" width="112" height="20" rx="8" fill="url(#gold)" stroke="#6b3f08" stroke-width="3"/>
      <rect x="246" y="348" width="20" height="62" fill="#4a2a10" stroke="#2a1606" stroke-width="3"/>
      <circle cx="256" cy="420" r="15" fill="url(#gold)" stroke="#6b3f08" stroke-width="3"/>
    </g>
    <use href="#sword" transform="matrix(-1 0 0 1 512 0)"/>

    <!-- shield -->
    <path d="M256 118 L364 154 C364 262 330 334 256 384 C182 334 148 262 148 154 Z"
          fill="url(#shield)" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M256 140 L344 170 C342 258 314 318 256 360 C198 318 170 258 168 170 Z"
          fill="none" stroke="#7fb0ff" stroke-opacity="0.45" stroke-width="3"/>

    <!-- lane map: three lanes converging -->
    <g stroke="#9fc4ff" stroke-opacity="0.55" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M190 320 L256 186"/>
      <path d="M322 320 L256 186"/>
      <path d="M190 320 Q256 300 322 320" />
    </g>

    <!-- central crystal (the "core") -->
    <circle cx="256" cy="246" r="58" fill="url(#glow)"/>
    <polygon points="256,180 296,240 256,312 216,240" fill="url(#gem)" stroke="#fff1c9" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="256,180 256,312 216,240" fill="#ffffff" opacity="0.18"/>
    <polygon points="256,180 296,240 256,240" fill="#ffffff" opacity="0.28"/>

    <!-- crown spikes on top of shield -->
    <path d="M214 132 L228 92 L242 124 L256 76 L270 124 L284 92 L298 132 Z"
          fill="url(#gold)" stroke="#6b3f08" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="256" cy="108" r="7" fill="#ff5e3a" stroke="#fff1c9" stroke-width="2"/>

    <!-- title banner -->
    <path d="M86 404 L426 404 L410 430 L426 456 L86 456 L102 430 Z"
          fill="#b3122f" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
    <text x="256" y="442" text-anchor="middle"
          font-family="Impact, 'Arial Black', sans-serif" font-size="36" letter-spacing="3"
          fill="url(#gold)" stroke="#3a0610" stroke-width="1.5">ASTRA LEGION</text>
  </g>
</svg>
